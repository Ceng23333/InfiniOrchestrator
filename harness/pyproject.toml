[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "infini-orchestrator-harness"
version = "0.1.0"
description = "Bench runners and HTTP scrape client for InfiniOrchestrator (data plane in bench-warehouse)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "bench-warehouse @ file:../../bench-warehouse",
]

# No warehouse console scripts here — use warehouse-emit / warehouse-compact from bench-warehouse.

[tool.setuptools]
py-modules = ["server_client"]
