[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bench-harness"
version = "0.1.0"
description = "Bench runners, ingest, and warehouse compact for InfiniTeor bench-warehouse"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
]

[project.scripts]
bench-emit = "bench_harness.emit:main"
bench-compact = "bench_harness.compact:main"
bench-validate-e2e = "bench_harness.validate_e2e:main"
bench-query = "bench_harness.query:main"

[tool.setuptools.packages.find]
where = ["."]
