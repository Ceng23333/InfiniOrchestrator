[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-minicpm5"
version = "0.1.0"
description = "Out-of-tree vLLM plugin: native MiniCPM5MoEForCausalLM (FusedMoE + gated GQA)"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."vllm.general_plugins"]
minicpm5_moe = "vllm_minicpm5:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["vllm_minicpm5*"]
