# Standalone babysitter wrap: stock vLLM + vllm_minicpm5 plugin for minicpm5

name = "master-minicpm5-vllm"
host = "0.0.0.0"
port = 18180

[babysitter]
max_restarts = 10000
restart_delay = 5
heartbeat_interval = 30

[backend]
type = "vllm"
model = "/models/minicpm5"
args = [
  "--tokenizer", "/opt/vllm_minicpm5/tokenizer_bytelevel",
  "--tensor-parallel-size", "1",
  "--dtype", "bfloat16",
  "--trust-remote-code",
  "--max-model-len", "32768",
  "--gpu-memory-utilization", "0.85",
  "--host", "0.0.0.0",
]

[backend.env]
HPCC_VISIBLE_DEVICES = "0"
VLLM_TUNED_CONFIG_FOLDER = "/opt/vllm_minicpm5/moe_configs"

[metadata]
backend_type = "vllm"
static = true
