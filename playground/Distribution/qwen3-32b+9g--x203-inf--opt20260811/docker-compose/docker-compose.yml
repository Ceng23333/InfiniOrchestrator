# Case workers + overrides for shared Frontend/etcd fragments (Dynamo-style).
# Bring-up (same host):
#   ./compose.sh --profile frontend --profile workers up -d
# Frontend only / workers only (multi-host or localhost sim):
#   COMPOSE_PROJECT_NAME=io-frontend ./compose.sh --profile frontend up -d
#   COMPOSE_PROJECT_NAME=io-workers  ./compose.sh --profile workers up -d
# Optional Prom/Grafana:
#   ./compose.sh --profile observability up -d
# Optional bench-warehouse hot sync (named volume; needs GitHub token for private HTTPS):
#   ./compose.sh --profile frontend --profile warehouse-sync up -d
version: "2.4"
networks:
  default:
    ipam:
      config:
        # Avoid 172.22.0.0/16 — overlaps site NFS/LAN (172.22.162.46).
        # Parallel projects on one host (fake multi-node) must override COMPOSE_SUBNET.
        - subnet: ${COMPOSE_SUBNET:-172.28.0.0/16}

services:
  etcd:
    container_name: infiniorch-etcd-opt-20260811
    # Debug / multi-host publish; shared fragment keeps etcd internal by default.
    ports:
      - "2379:2379"

  frontend:
    container_name: infiniorch-frontend-opt-20260811
    environment:
      DISCOVERY_PREFIX: ${DISCOVERY_PREFIX:-/infini/orchestrator}
      ROUTER_PORT: ${ROUTER_PORT:-8800}
      REGISTRY_PORT: ${REGISTRY_PORT:-18000}
      CACHE_TYPE_ROUTING_THRESHOLD: ${CACHE_TYPE_ROUTING_THRESHOLD:-51200}
      IO_ROOT: /io
    volumes:
      # Dev overlay: host-built Frontend binary + IO tree for panel case-browser.
      - ${IO_RUST_RELEASE_DIR:-../../../../rust/target/release}/infini-loadbalancer:/usr/local/bin/infini-loadbalancer:ro
      - ${IO_HOST_PATH:-../../../../}:/io:ro

  worker-9g-8100:
    profiles: ["workers"]
    image: ${IMAGE_TAG}
    container_name: infiniorch-worker-9g-8100-20260811
    restart: unless-stopped
    environment:
      LAUNCH_COMPONENTS: entrypoint
      ETCD_ENDPOINTS: ${ETCD_ENDPOINTS:-http://etcd:2379}
      DISCOVERY_PREFIX: ${DISCOVERY_PREFIX:-/infini/orchestrator}
      ROUTER_URL: ${ROUTER_URL:-http://frontend:8800}
      REGISTRY_URL: ${REGISTRY_URL:-http://frontend:18000}
      BABYSITTER_CONFIGS: /config/9g_8b_thinking.toml
      BABYSITTER_HOST: ${ADVERTISE_HOST:-worker-9g-8100}
    volumes:
      - ./config:/config:ro
      - ${MODEL1_DIR}:/models/9g_8b_thinking:ro
    ports:
      - "${WORKER_9G_API_PORT:-8100}:8100"
      - "${WORKER_9G_BABYSITTER_PORT:-8101}:8101"
    ipc: host
    shm_size: 100gb
    ulimits:
      memlock:
        soft: -1
        hard: -1
    devices:
      - /dev/dri
      - /dev/htcd
      - /dev/infiniband
    group_add:
      - video
    privileged: true
    security_opt:
      - apparmor=unconfined

  worker-qwen-paged-8200:
    profiles: ["workers"]
    image: ${IMAGE_TAG}
    container_name: infiniorch-worker-qwen-paged-8200-20260811
    restart: unless-stopped
    environment:
      LAUNCH_COMPONENTS: entrypoint
      ETCD_ENDPOINTS: ${ETCD_ENDPOINTS:-http://etcd:2379}
      DISCOVERY_PREFIX: ${DISCOVERY_PREFIX:-/infini/orchestrator}
      ROUTER_URL: ${ROUTER_URL:-http://frontend:8800}
      REGISTRY_URL: ${REGISTRY_URL:-http://frontend:18000}
      BABYSITTER_CONFIGS: /config/qwen3-32b-paged.toml
      BABYSITTER_HOST: ${ADVERTISE_HOST:-worker-qwen-paged-8200}
    ports:
      - "${WORKER_QWEN_API_PORT:-8200}:8200"
      - "${WORKER_QWEN_BABYSITTER_PORT:-8201}:8201"
    volumes:
      - ./config:/config:ro
      - ${QWEN3_32B_DIR}:/models/Qwen3-32B:ro
      - ${PIECEWISE_INDUCTOR_CACHE_DIR:-../cache/piecewise_inductor}:/workspace/piecewise_inductor_cache:rw
    ipc: host
    shm_size: 100gb
    ulimits:
      memlock:
        soft: -1
        hard: -1
    devices:
      - /dev/dri
      - /dev/htcd
      - /dev/infiniband
    group_add:
      - video
    privileged: true
    security_opt:
      - apparmor=unconfined

  worker-embeddings-20002:
    profiles: ["workers"]
    image: ${EMBEDDING_IMAGE_TAG}
    container_name: infiniorch-worker-embeddings-20002-20260811
    restart: unless-stopped
    environment:
      LAUNCH_COMPONENTS: babysitter
      ETCD_ENDPOINTS: ${ETCD_ENDPOINTS:-http://etcd:2379}
      DISCOVERY_PREFIX: ${DISCOVERY_PREFIX:-/infini/orchestrator}
      REGISTRY_URL: ${REGISTRY_URL:-http://frontend:18000}
      ROUTER_URL: ${ROUTER_URL:-http://frontend:8800}
      BABYSITTER_CONFIGS: /config/embeddings.toml
      BABYSITTER_HOST: ${ADVERTISE_HOST:-worker-embeddings-20002}
    volumes:
      - ./config:/config:ro
      - ./embeddings_server.py:/app/embeddings_server.py:ro
      - ${EMBEDDING_MODEL_DIR:-./models}:/workspace/models:ro
    ports:
      - "${EMBEDDING_PORT:-20002}:20002"
    ipc: host
    shm_size: 100gb
    ulimits:
      memlock:
        soft: -1
        hard: -1
    devices:
      - /dev/dri
      - /dev/htcd
      - /dev/infiniband
    group_add:
      - video
    privileged: true
    security_opt:
      - apparmor=unconfined
