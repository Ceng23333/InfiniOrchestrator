# Case workers + overrides for shared Frontend/etcd fragments.
# Bring-up:
#   ./compose.sh --profile frontend --profile workers up -d
# Optional Prom/Grafana:
#   ./compose.sh --profile observability up -d
version: "2.4"
networks:
  default:
    ipam:
      config:
        # Avoid 172.22.0.0/16 — overlaps site NFS/LAN (172.22.162.46).
        - subnet: 172.28.0.0/16

services:
  etcd:
    container_name: infiniorch-etcd-opt-20260811
    # Debug publish (optional); shared fragment keeps etcd internal by default.
    ports:
      - "2379:2379"

  frontend:
    container_name: infiniorch-master-opt-20260811
    environment:
      DISCOVERY_PREFIX: ${DISCOVERY_PREFIX:-/infini/orchestrator}
      ROUTER_PORT: ${ROUTER_PORT:-8800}
      REGISTRY_PORT: ${REGISTRY_PORT:-18000}
      CACHE_TYPE_ROUTING_THRESHOLD: ${CACHE_TYPE_ROUTING_THRESHOLD:-51200}
      BENCH_WAREHOUSE_REPO: /warehouse
      IO_ROOT: /io
    volumes:
      # Dev overlay: host-built Frontend with Visualization tab + warehouse for harness APIs.
      - ${IO_RUST_RELEASE_DIR:-../../../../rust/target/release}/infini-loadbalancer:/usr/local/bin/infini-loadbalancer:ro
      - ${BENCH_WAREHOUSE_HOST_PATH:-../../../../../bench-warehouse}:/warehouse:ro
      - ${IO_HOST_PATH:-../../../../}:/io:ro

  worker-master-9g-8100:
    profiles: ["workers"]
    image: ${IMAGE_TAG}
    container_name: infiniorch-worker-master-9g-8100-20260811
    restart: unless-stopped
    depends_on:
      - frontend
      - etcd
    environment:
      LAUNCH_COMPONENTS: entrypoint
      ETCD_ENDPOINTS: http://etcd:2379
      DISCOVERY_PREFIX: ${DISCOVERY_PREFIX:-/infini/orchestrator}
      ROUTER_URL: http://frontend:${ROUTER_PORT:-8800}
      BABYSITTER_CONFIGS: /config/master-9g_8b_thinking.toml
      BABYSITTER_HOST: worker-master-9g-8100
    volumes:
      - ./config:/config:ro
      - ${MODEL1_DIR}:/models/9g_8b_thinking:ro
    ports:
      - "${MASTER_9G_8B_THINKING_API_PORT:-8100}:8100"
      - "${MASTER_9G_8B_THINKING_BABYSITTER_PORT:-8101}:8101"
    ipc: host
    shm_size: 100gb
    ulimits:
      memlock:
        soft: -1
        hard: -1
    devices:
      - /dev/dri
      - /dev/htcd
      - /dev/infiniband
    group_add:
      - video
    privileged: true
    security_opt:
      - apparmor=unconfined

  worker-master-qwen-paged-8200:
    profiles: ["workers"]
    image: ${IMAGE_TAG}
    container_name: infiniorch-worker-master-qwen-paged-8200-20260811
    restart: unless-stopped
    depends_on:
      - frontend
      - etcd
    environment:
      LAUNCH_COMPONENTS: entrypoint
      ETCD_ENDPOINTS: http://etcd:2379
      DISCOVERY_PREFIX: ${DISCOVERY_PREFIX:-/infini/orchestrator}
      ROUTER_URL: http://frontend:${ROUTER_PORT:-8800}
      BABYSITTER_CONFIGS: /config/master-qwen3-32b-paged.toml
      BABYSITTER_HOST: worker-master-qwen-paged-8200
    ports:
      - "${MASTER_QWEN_PAGED_API_PORT:-8200}:8200"
      - "${MASTER_QWEN_PAGED_BABYSITTER_PORT:-8201}:8201"
    volumes:
      - ./config:/config:ro
      - ${QWEN3_32B_DIR}:/models/Qwen3-32B:ro
      - ${PIECEWISE_INDUCTOR_CACHE_DIR:-../cache/piecewise_inductor}:/workspace/piecewise_inductor_cache:rw
    ipc: host
    shm_size: 100gb
    ulimits:
      memlock:
        soft: -1
        hard: -1
    devices:
      - /dev/dri
      - /dev/htcd
      - /dev/infiniband
    group_add:
      - video
    privileged: true
    security_opt:
      - apparmor=unconfined

  worker-master-embeddings-20002:
    profiles: ["workers"]
    image: ${EMBEDDING_IMAGE_TAG}
    container_name: infiniorch-worker-master-embeddings-20002-20260811
    restart: unless-stopped
    depends_on:
      - frontend
      - etcd
    environment:
      LAUNCH_COMPONENTS: babysitter
      ETCD_ENDPOINTS: http://etcd:2379
      DISCOVERY_PREFIX: ${DISCOVERY_PREFIX:-/infini/orchestrator}
      REGISTRY_URL: http://frontend:${REGISTRY_PORT:-18000}
      ROUTER_URL: http://frontend:${ROUTER_PORT:-8800}
      BABYSITTER_CONFIGS: /config/master-embeddings.toml
      BABYSITTER_HOST: worker-master-embeddings-20002
    volumes:
      - ./config:/config:ro
      - ./embeddings_server.py:/app/embeddings_server.py:ro
      - ${EMBEDDING_MODEL_DIR:-./models}:/workspace/models:ro
    ports:
      - "${EMBEDDING_PORT:-20002}:20002"
    ipc: host
    shm_size: 100gb
    ulimits:
      memlock:
        soft: -1
        hard: -1
    devices:
      - /dev/dri
      - /dev/htcd
      - /dev/infiniband
    group_add:
      - video
    privileged: true
    security_opt:
      - apparmor=unconfined
