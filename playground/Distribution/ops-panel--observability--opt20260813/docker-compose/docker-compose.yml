# Case overrides for shared Frontend + observability fragments.
# Bring-up: ./compose.sh --profile frontend --profile observability up -d
# Obs-only vs host Frontend:
#   PROM_CONFIG=prometheus-host.yml ./compose.sh --profile observability up -d
version: "2.4"
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/16

services:
  frontend:
    environment:
      DISCOVERY_PREFIX: ${DISCOVERY_PREFIX:-/infini/orchestrator/ops-panel}
      BENCH_WAREHOUSE_REPO: /warehouse
      IO_ROOT: /io
      # Drop registry alias noise for panel-only labs (optional)
      REGISTRY_PORT: ${REGISTRY_PORT:-18800}
    volumes:
      - ${BENCH_WAREHOUSE_HOST_PATH}:/warehouse:ro
      - ${IO_HOST_PATH:-../../../../}:/io:ro
