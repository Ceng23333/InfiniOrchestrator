# Shared etcd discovery plane. Profile: frontend
# No host ports by default (compose-internal). Case may override to publish ETCD_HOST_PORT.
version: "2.4"
services:
  etcd:
    profiles: ["frontend"]
    image: ${ETCD_IMAGE_TAG:-quay.io/coreos/etcd:v3.7.0}
    restart: unless-stopped
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
    command:
      - etcd
      - --name=${ETCD_NAME:-infiniorch-etcd}
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=${ETCD_NAME:-infiniorch-etcd}=http://etcd:2380
      - --initial-cluster-token=${ETCD_CLUSTER_TOKEN:-infiniorch-etcd}
      - --initial-cluster-state=new
