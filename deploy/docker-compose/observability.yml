# Prometheus + Grafana (Dynamo-style public observability). Profile: observability
# Scrapes OBS_SCRAPE_TARGET (default frontend:8800). Does not start a second Frontend.
version: "2.4"
services:
  prometheus:
    profiles: ["observability"]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ${PROM_CONFIG_FILE}:/etc/prometheus/prometheus.yml:ro
    ports:
      - "0.0.0.0:${PROM_HOST_PORT:-9090}:9090"

  grafana:
    profiles: ["observability"]
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.2.0}
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
    volumes:
      - ${GRAFANA_PROVISIONING_DIR}:/etc/grafana/provisioning:ro
    ports:
      - "0.0.0.0:${GRAFANA_HOST_PORT:-3000}:3000"
