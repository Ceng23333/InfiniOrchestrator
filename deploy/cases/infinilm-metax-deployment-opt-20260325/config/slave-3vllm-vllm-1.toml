# Slave Preset 3vllm - Qwen3-32B vLLM instance 1

name = "slave-3vllm-vllm-1"
host = "0.0.0.0"
port = 8200

registry_url = "http://localhost:18000"
router_url = "http://localhost:8000"

[babysitter]
max_restarts = 10000
restart_delay = 5
heartbeat_interval = 30

[backend]
type = "vllm"
model = "/models/Qwen3-32B"
args = ["--tensor-parallel-size", "4", "--gpu-memory-utilization", "0.9", "--host", "0.0.0.0"]

[backend.env]
CUDA_VISIBLE_DEVICES = "0,1,2,3"

[metadata]
cache_type = "static"
backend_type = "vllm"
static = true
