<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promotion loop review</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --fg: #1a1a1a;
      --muted: #5c5c5c;
      --line: #d8d5ce;
      --card: #fff;
      --accent: #0b5fff;
      --accent2: #9aa3b2;
      --ok: #0a7a3e;
      --bad: #a11;
      --warn: #8a5a00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.45 system-ui, Segoe UI, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    header, main, footer { max-width: 1100px; margin: 0 auto; padding: 1rem 1.25rem; }
    header { padding-top: 1.5rem; }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 0.35rem; }
    h2 { font-size: 1rem; font-weight: 600; margin: 0 0 0.6rem; }
    h3 { font-size: 0.92rem; font-weight: 600; margin: 0.8rem 0 0.4rem; color: var(--muted); }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
    select, button {
      font: inherit;
      padding: 0.35rem 0.6rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--card);
      cursor: pointer;
    }
    .tabs { display: flex; gap: 0.35rem; margin-top: 0.75rem; }
    .tabs button.is-active {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .view { display: none; }
    .view.is-active { display: block; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.9rem 1rem;
      margin: 0.75rem 0;
    }
    .kpi { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; }
    .pill {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      font-size: 0.8rem;
      font-weight: 500;
    }
    .pill.ok { color: var(--ok); border-color: #9dceb0; }
    .pill.bad { color: var(--bad); border-color: #e0a8a8; }
    .pill.warn { color: var(--warn); border-color: #e0c98a; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { text-align: left; padding: 0.35rem 0.4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .bar-wrap { height: 8px; background: #eceae4; border-radius: 4px; overflow: hidden; min-width: 80px; }
    .bar { height: 100%; background: var(--accent); }
    .bar.base { background: var(--accent2); }
    .bars { display: grid; gap: 0.25rem; }
    .rank { font-variant-numeric: tabular-nums; }
    .empty { color: var(--muted); font-style: italic; }
    .chart-wrap { width: 100%; }
    .chart-wrap svg { display: block; margin: 0 auto; }
    .legend { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 0.4rem 0 0.8rem; font-size: 0.85rem; color: var(--muted); }
    .legend span::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 0.35rem;
      border-radius: 2px;
      background: currentColor;
      vertical-align: -1px;
    }
    .legend .achieved { color: var(--ok); }
    .legend .leftover { color: var(--bad); }
    .legend .surplus { color: var(--accent); }
    .pie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(176px, 1fr));
      gap: 1rem;
    }
    .pie-card { text-align: center; }
    .pie-card .label { font-size: 0.85rem; color: var(--muted); margin-top: 0.35rem; }
    .pie-card .value { font-size: 0.92rem; font-variant-numeric: tabular-nums; }
    .iter-picker { display: flex; flex-wrap: wrap; gap: 0.5rem 0.85rem; align-items: center; }
    .iter-picker label { display: inline-flex; gap: 0.3rem; align-items: center; font-size: 0.9rem; cursor: pointer; }
    .iter-picker .actions { display: flex; gap: 0.4rem; margin-left: auto; }
    .fetch-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 0.75rem; }
    .fetch-bar .status { font-size: 0.85rem; color: var(--muted); }
    .fetch-bar button:disabled { opacity: 0.6; cursor: wait; }
    footer { color: var(--muted); font-size: 0.8rem; padding-bottom: 2rem; }
    code { font-size: 0.85em; }
    .iter-block { border-top: 1px solid var(--line); padding-top: 0.7rem; margin-top: 0.7rem; }
    .iter-block:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  </style>
</head>
<body>
  <header>
    <div class="row" style="justify-content: space-between;">
      <div>
        <h1>Promotion loop review</h1>
        <p class="muted" id="subtitle">Loading facts…</p>
      </div>
      <label class="muted">Campaign
        <select id="campaign-select" aria-label="Campaign"></select>
      </label>
    </div>
    <div class="fetch-bar" aria-label="Facts fetch">
      <label class="muted">Facts source
        <select id="facts-source" aria-label="Facts source"></select>
      </label>
      <button type="button" id="fetch-latest">Fetch latest</button>
      <span class="status" id="fetch-status">Using embedded facts until fetch</span>
    </div>
    <div class="tabs" role="tablist" aria-label="Review views">
      <button type="button" class="is-active" data-view="tables" role="tab" aria-selected="true">Tables</button>
      <button type="button" data-view="charts" role="tab" aria-selected="false">Charts</button>
    </div>
  </header>
  <main>
    <div id="view-tables" class="view is-active">
      <section class="panel" id="headline"></section>
      <section class="panel" id="wall"></section>
      <section class="panel" id="backlog"></section>
      <section class="panel" id="ship"></section>
    </div>
    <div id="view-charts" class="view">
      <section class="panel" id="chart-iter-picker"></section>
      <section class="panel" id="chart-wall-leftover"></section>
      <section class="panel" id="chart-path-leftover"></section>
    </div>
  </main>
  <footer id="provenance"></footer>

  <!-- PROMO_FACTS_JSON: emitter replaces the next application/json script body. -->
  <script type="application/json" id="promo-facts">
{"schema_version":"promo-facts-1","campaigns":[]}
  </script>
  <script>
    function $(id) { return document.getElementById(id); }
    function fmt(n, d) {
      if (n == null || Number.isNaN(Number(n))) return "—";
      return Number(n).toFixed(d == null ? 3 : d);
    }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function gatePill(gate) {
      if (!gate) return "";
      var cls = "warn";
      if (gate === "SURPASS" || gate === "PASS") cls = "ok";
      if (gate === "NO_GO" || gate === "PROFILE_REGRESS") cls = "bad";
      return '<span class="pill ' + cls + '">' + esc(gate) + "</span>";
    }
    function lastIter(c) {
      var iters = c.iters || [];
      return iters.length ? iters[iters.length - 1] : null;
    }
    function maxWall(c) {
      var m = 0;
      (c.iters || []).forEach(function (it) {
        if (!it.wall) return;
        m = Math.max(m, Number(it.wall.baseline) || 0, Number(it.wall.candidate) || 0);
      });
      return m || 1;
    }
    function metricLabel(c) {
      for (var i = (c.iters || []).length - 1; i >= 0; i--) {
        if (c.iters[i].wall && c.iters[i].wall.metric) return c.iters[i].wall.metric;
      }
      return "—";
    }
    function sourceLabel(c) {
      for (var i = (c.iters || []).length - 1; i >= 0; i--) {
        if (c.iters[i].wall && c.iters[i].wall.source) return c.iters[i].wall.source;
      }
      return "—";
    }

    function renderHeadline(c) {
      var it = lastIter(c);
      var wall = it && it.wall;
      var backlog = it && it.backlog;
      var ship = it && it.ship;
      var ratio = wall ? wall.WALL_DECODE_RATIO : null;
      var gate = wall ? wall.gate : (ship && ship.surpass ? "SURPASS" : null);
      $("headline").innerHTML =
        '<div class="row" style="justify-content:space-between;align-items:flex-start;">' +
          '<div>' +
            '<div class="muted">Latest WALL_DECODE_RATIO · all ' + (c.iters || []).length + ' iters below</div>' +
            '<div class="kpi">' + fmt(ratio, 3) + " " + gatePill(gate) + "</div>" +
            '<div class="muted" style="margin-top:0.4rem;">latest top_path: <strong>' +
              esc((backlog && backlog.top_path) || "—") + "</strong></div>" +
          "</div>" +
          '<div class="muted" style="text-align:right;">' +
            "<div><strong>" + esc(c.host || "") + "</strong> · " + esc(c.vendor_profiler || "") + "</div>" +
            "<div>cell: " + esc(c.cell || "—") + "</div>" +
            "<div>pin baseline: <code>" + esc(c.pin_baseline || "—") + "</code></div>" +
            "<div>pin candidate: <code>" + esc(c.pin_candidate || "—") + "</code></div>" +
            "<div>worktree baseline: <code>" + esc(c.worktree_baseline || "—") + "</code></div>" +
            "<div>worktree candidate: <code>" + esc(c.worktree_candidate || "—") + "</code></div>" +
            (c.itw_tag_candidate || c.itw_tag_baseline
              ? "<div>ITW tag: <code>" + esc(c.itw_tag_candidate || c.itw_tag_baseline) + "</code></div>"
              : "") +
          "</div>" +
        "</div>";
    }

    function renderWall(c) {
      var iters = c.iters || [];
      var mx = maxWall(c);
      if (!iters.some(function (it) { return it.wall; })) {
        $("wall").innerHTML = "<h2>Wall timeline</h2><p class='empty'>No wall facts</p>";
        return;
      }
      var rows = iters.map(function (it) {
        var w = it.wall || {};
        var b = Number(w.baseline) || 0;
        var cand = Number(w.candidate) || 0;
        return "<tr>" +
          "<td class='rank'>" + esc(it.iter) + "</td>" +
          "<td>" + esc(it.lever_applied || "—") + "</td>" +
          "<td class='rank'>" + fmt(cand, 2) + "</td>" +
          "<td class='rank'>" + fmt(b, 2) + "</td>" +
          "<td class='rank'>" + fmt(w.WALL_DECODE_RATIO, 3) + "</td>" +
          "<td>" + gatePill(w.gate) + "</td>" +
          "<td><div class='bars'>" +
            "<div class='bar-wrap' title='candidate'><div class='bar' style='width:" + (100 * cand / mx) + "%'></div></div>" +
            "<div class='bar-wrap' title='baseline'><div class='bar base' style='width:" + (100 * b / mx) + "%'></div></div>" +
          "</div></td></tr>";
      }).join("");
      $("wall").innerHTML =
        "<h2>Wall timeline (all iters)</h2>" +
        "<table><thead><tr>" +
        "<th>Iter</th><th>Lever</th><th>Candidate</th><th>Baseline</th><th>Ratio</th><th>Gate</th><th>Bars</th>" +
        "</tr></thead><tbody>" + rows + "</tbody></table>" +
        "<p class='muted'>Metric: " + esc(metricLabel(c)) + " · source: " + esc(sourceLabel(c)) + "</p>";
    }

    function renderBacklog(c) {
      var iters = c.iters || [];
      var blocks = iters.map(function (it) {
        var b = it.backlog;
        if (!b) {
          return "<div class='iter-block'><h3>Iter " + esc(it.iter) + " · " + esc(it.lever_applied || "—") +
            "</h3><p class='empty'>No backlog</p></div>";
        }
        var ranked = b.ranked || [];
        var rows = ranked.map(function (r, i) {
          var ex = (b.exhausted || []).indexOf(r.path_id) >= 0 ? " · exhausted" : "";
          return "<tr><td class='rank'>" + esc(r.rank != null ? r.rank : i + 1) + "</td><td><strong>" +
            esc(r.path_id) + "</strong>" + ex + "</td><td class='muted'>" +
            esc(((r.reasons || []).slice(0, 2).join("; ") || "—")) +
            "</td><td class='muted'>" + esc(r.lever || "") + "</td></tr>";
        }).join("");
        return "<div class='iter-block'>" +
          "<h3>Iter " + esc(it.iter) + " · top_path=<strong>" + esc(b.top_path || "—") +
          "</strong> · host_first_fired=" + !!b.host_first_fired +
          " · lever=" + esc(it.lever_applied || "—") + "</h3>" +
          (rows
            ? "<table><thead><tr><th>#</th><th>path_id</th><th>reasons</th><th>lever</th></tr></thead><tbody>" +
              rows + "</tbody></table>"
            : "<p class='empty'>No ranked paths</p>") +
          "</div>";
      }).join("");
      if (!iters.length) {
        $("backlog").innerHTML = "<h2>Backlog</h2><p class='empty'>No iters</p>";
        return;
      }
      $("backlog").innerHTML = "<h2>Backlog (all iters)</h2>" + blocks;
    }

    function renderShip(c) {
      var iters = c.iters || [];
      var rows = iters.map(function (it) {
        var s = it.ship || {};
        var gate = it.wall && it.wall.gate;
        return "<tr>" +
          "<td class='rank'>" + esc(it.iter) + "</td>" +
          "<td>" + esc(it.lever_applied || "—") + "</td>" +
          "<td>" + (s.surpass ? gatePill("SURPASS") : gatePill(gate || "NO_GO")) + "</td>" +
          "<td><code>" + esc(s.actions || "none") + "</code></td>" +
          "<td class='muted'><code>" + esc(s.findings_path || "—") + "</code></td>" +
        "</tr>";
      }).join("");
      if (!iters.length) {
        $("ship").innerHTML = "<h2>Ship</h2><p class='empty'>No ship facts</p>";
        return;
      }
      $("ship").innerHTML =
        "<h2>Ship (all iters)</h2>" +
        "<table><thead><tr><th>Iter</th><th>Lever</th><th>Gate</th><th>Actions</th><th>Findings</th></tr></thead>" +
        "<tbody>" + rows + "</tbody></table>";
    }

    function polar(cx, cy, r, angle) {
      return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
    }
    function svgPie(slices, opts) {
      opts = opts || {};
      var size = opts.size || 148;
      var cx = size / 2;
      var cy = size / 2;
      var r = size * 0.38;
      var total = 0;
      slices.forEach(function (s) { total += Math.max(0, Number(s.value) || 0); });
      if (!total) {
        return '<svg viewBox="0 0 ' + size + " " + size + '" width="' + size + '" height="' + size +
          '" role="img"><circle cx="' + cx + '" cy="' + cy + '" r="' + r +
          '" fill="#eceae4"></circle></svg>';
      }
      var angle = -Math.PI / 2;
      var paths = slices.map(function (s) {
        var v = Math.max(0, Number(s.value) || 0);
        if (!v) return "";
        var sweep = (v / total) * Math.PI * 2;
        var a0 = angle;
        var a1 = angle + sweep;
        angle = a1;
        var p0 = polar(cx, cy, r, a0);
        var p1 = polar(cx, cy, r, a1);
        var large = sweep > Math.PI ? 1 : 0;
        // Full circle special-case
        if (Math.abs(sweep - Math.PI * 2) < 1e-9) {
          return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + (s.color || "#9aa3b2") +
            '"><title>' + esc(s.label) + ": " + fmt(v / total * 100, 1) + "%</title></circle>";
        }
        return '<path d="M ' + cx + " " + cy + " L " + p0[0].toFixed(2) + " " + p0[1].toFixed(2) +
          " A " + r + " " + r + " 0 " + large + " 1 " + p1[0].toFixed(2) + " " + p1[1].toFixed(2) +
          ' Z" fill="' + (s.color || "#9aa3b2") + '"><title>' + esc(s.label) + ": " +
          fmt(v / total * 100, 1) + "%</title></path>";
      }).join("");
      return '<svg viewBox="0 0 ' + size + " " + size + '" width="' + size + '" height="' + size +
        '" role="img" aria-label="' + esc(opts.title || "pie") + '">' + paths + "</svg>";
    }
    function wallLeftoverSlices(ratio) {
      var r = Number(ratio);
      if (Number.isNaN(r)) return [];
      if (r >= 1) {
        return [
          { label: "achieved (≥1.0)", value: 1, color: "#0a7a3e" },
          { label: "surplus over parity", value: Math.max(0, r - 1), color: "#0b5fff" },
        ];
      }
      return [
        { label: "achieved", value: Math.max(0, r), color: "#0a7a3e" },
        { label: "leftover to parity", value: Math.max(0, 1 - r), color: "#a11" },
      ];
    }
    function pathLeftoverSlices(backlog) {
      var palette = ["#0b5fff", "#8a5a00", "#6b5b95", "#2a9d8f", "#a11", "#9aa3b2", "#0a7a3e"];
      var ranked = (backlog && backlog.ranked) || [];
      var hasScore = ranked.some(function (r) {
        return r.score != null && !Number.isNaN(Number(r.score)) && Number(r.score) > 0;
      });
      var slices = [];
      ranked.forEach(function (r, i) {
        if (!r.path_id) return;
        var weight;
        if (hasScore) {
          weight = Math.max(0, Number(r.score) || 0);
        } else {
          var rank = Number(r.rank);
          if (Number.isNaN(rank) || rank <= 0) rank = i + 1;
          weight = 1 / rank; // higher rank → larger leftover-path share when scores absent
        }
        if (weight <= 0) return;
        slices.push({
          label: r.path_id,
          value: weight,
          color: palette[i % palette.length],
        });
      });
      return slices;
    }

    var chartState = {
      campaignId: null,
      selected: {}, // iter key -> true
    };

    function iterKey(it) { return String(it.iter); }

    function defaultChartSelection(iters) {
      var selected = {};
      if (!iters.length) return selected;
      selected[iterKey(iters[iters.length - 1])] = true; // latest only
      return selected;
    }

    function ensureChartSelection(c) {
      var iters = c.iters || [];
      if (chartState.campaignId !== c.campaign_id) {
        chartState.campaignId = c.campaign_id || null;
        chartState.selected = defaultChartSelection(iters);
        return;
      }
      // Drop stale keys; keep user picks that still exist.
      var valid = {};
      iters.forEach(function (it) {
        var k = iterKey(it);
        if (chartState.selected[k]) valid[k] = true;
      });
      if (!Object.keys(valid).length) valid = defaultChartSelection(iters);
      chartState.selected = valid;
    }

    function selectedIters(c) {
      return (c.iters || []).filter(function (it) { return !!chartState.selected[iterKey(it)]; });
    }

    function renderChartIterPicker(c) {
      var iters = c.iters || [];
      ensureChartSelection(c);
      var checks = iters.map(function (it) {
        var k = iterKey(it);
        var checked = chartState.selected[k] ? " checked" : "";
        var label = "iter " + esc(it.iter) + (it.lever_applied ? " · " + esc(it.lever_applied) : "");
        return '<label><input type="checkbox" data-iter="' + esc(k) + '"' + checked + "> " + label + "</label>";
      }).join("");
      $("chart-iter-picker").innerHTML =
        "<h2>Chart iters</h2>" +
        "<p class='muted'>Default: latest only. Toggle iters to include in leftover pies.</p>" +
        '<div class="iter-picker">' + checks +
          '<div class="actions">' +
            '<button type="button" id="chart-iters-latest">Latest</button>' +
            '<button type="button" id="chart-iters-all">All</button>' +
            '<button type="button" id="chart-iters-none">None</button>' +
          "</div>" +
        "</div>";

      $("chart-iter-picker").querySelectorAll('input[type="checkbox"]').forEach(function (box) {
        box.onchange = function () {
          chartState.selected[box.getAttribute("data-iter")] = box.checked;
          renderChartBodies(c);
        };
      });
      $("chart-iters-latest").onclick = function () {
        chartState.selected = defaultChartSelection(iters);
        renderCharts(c);
      };
      $("chart-iters-all").onclick = function () {
        var selected = {};
        iters.forEach(function (it) { selected[iterKey(it)] = true; });
        chartState.selected = selected;
        renderCharts(c);
      };
      $("chart-iters-none").onclick = function () {
        chartState.selected = {};
        renderCharts(c);
      };
    }

    function renderChartBodies(c) {
      var iters = selectedIters(c);
      var nSel = iters.length;
      var wallCards = iters.filter(function (it) { return it.wall && it.wall.WALL_DECODE_RATIO != null; }).map(function (it) {
        var ratio = Number(it.wall.WALL_DECODE_RATIO);
        var leftover = ratio >= 1 ? 0 : Math.max(0, 1 - ratio);
        return '<div class="pie-card">' +
          svgPie(wallLeftoverSlices(ratio), { title: "iter " + it.iter + " wall leftover" }) +
          '<div class="label">iter ' + esc(it.iter) + (it.lever_applied ? " · " + esc(it.lever_applied) : "") + "</div>" +
          '<div class="value">ratio ' + fmt(ratio, 3) + " · leftover " + fmt(leftover * 100, 1) + "%</div>" +
          "</div>";
      }).join("");
      $("chart-wall-leftover").innerHTML =
        "<h2>Charts · wall leftover share (" + nSel + " selected)</h2>" +
        '<div class="legend"><span class="achieved">achieved</span><span class="leftover">leftover to parity</span><span class="surplus">surplus (≥1.0)</span></div>' +
        (wallCards ? '<div class="pie-grid">' + wallCards + "</div>" : "<p class='empty'>No selected iters with wall ratios</p>") +
        "<p class='muted'>Leftover = max(0, 1 − WALL_DECODE_RATIO). Metric: " + esc(metricLabel(c)) + "</p>";

      var pathCards = iters.map(function (it) {
        var slices = pathLeftoverSlices(it.backlog);
        if (!slices.length) return "";
        var total = slices.reduce(function (a, s) { return a + s.value; }, 0);
        var top = (it.backlog && it.backlog.top_path) || slices[0].label;
        var legend = slices.slice(0, 4).map(function (s) {
          return esc(s.label) + " " + fmt(s.value / total * 100, 1) + "%";
        }).join(" · ");
        if (slices.length > 4) legend += " · …";
        return '<div class="pie-card">' +
          svgPie(slices, { title: "iter " + it.iter + " path leftover" }) +
          '<div class="label">iter ' + esc(it.iter) + " · top_path=<strong>" + esc(top) + "</strong></div>" +
          '<div class="value">' + legend + "</div>" +
          "</div>";
      }).filter(Boolean).join("");
      $("chart-path-leftover").innerHTML =
        "<h2>Charts · path leftover share (" + nSel + " selected)</h2>" +
        "<p class='muted'>Slice weight = backlog <code>score</code> when present; else <code>1/rank</code> over ranked <code>path_id</code>.</p>" +
        (pathCards
          ? '<div class="pie-grid">' + pathCards + "</div>"
          : "<p class='empty'>No ranked paths for selected iters</p>");
    }

    function renderCharts(c) {
      renderChartIterPicker(c);
      renderChartBodies(c);
    }

    function renderProvenance(c, payload) {
      var agents = (c.agent_ids || []).join(", ") || "—";
      var paths = (c.source_paths || []).map(function (p) {
        return "<div><code>" + esc(p) + "</code></div>";
      }).join("");
      $("provenance").innerHTML =
        "<div>schema " + esc(payload.schema_version || "") +
        " · generated " + esc(payload.generated_at || "—") +
        " · iters shown: all (" + (c.iters || []).length + ")</div>" +
        "<div>campaign_id: <code>" + esc(c.campaign_id || "") + "</code> · agents: " + esc(agents) + "</div>" +
        "<div>worktree baseline: <code>" + esc(c.worktree_baseline || "—") + "</code>" +
        " · worktree candidate: <code>" + esc(c.worktree_candidate || "—") + "</code></div>" +
        "<div>ITW tags: baseline <code>" + esc(c.itw_tag_baseline || "—") + "</code>" +
        " · candidate <code>" + esc(c.itw_tag_candidate || c.pin_candidate || "—") + "</code></div>" +
        (paths || "");
      $("subtitle").textContent =
        (payload.campaigns || []).length + " campaign(s) · " + (c.iters || []).length +
        " iters · " + (c.worktree_candidate || c.pin_candidate || "no-worktree") +
        " · promo-facts review";
    }

    function render(payload, idx) {
      var campaigns = payload.campaigns || [];
      if (!campaigns.length) {
        $("headline").innerHTML = "<p class='empty'>No campaigns in facts payload</p>";
        ["wall", "backlog", "ship", "chart-iter-picker", "chart-wall-leftover", "chart-path-leftover"].forEach(function (id) {
          $(id).innerHTML = "";
        });
        chartState = { campaignId: null, selected: {} };
        $("provenance").textContent = "Empty promo-facts-1 payload";
        return;
      }
      var sel = $("campaign-select");
      if (sel.options.length !== campaigns.length) {
        sel.innerHTML = campaigns.map(function (c, i) {
          var wt = c.worktree_candidate || c.itw_tag_candidate || c.pin_candidate || "";
          return "<option value='" + i + "'>" + esc(c.host || "host") + " · " + esc(c.campaign_id || i) +
            (wt ? " · " + esc(wt) : "") + "</option>";
        }).join("");
      }
      sel.value = String(idx);
      var c = campaigns[idx];
      renderHeadline(c);
      renderWall(c);
      renderBacklog(c);
      renderShip(c);
      renderCharts(c);
      renderProvenance(c, payload);
    }

    function setupTabs() {
      var buttons = document.querySelectorAll(".tabs button");
      buttons.forEach(function (btn) {
        btn.onclick = function () {
          buttons.forEach(function (b) {
            b.classList.toggle("is-active", b === btn);
            b.setAttribute("aria-selected", b === btn ? "true" : "false");
          });
          document.querySelectorAll(".view").forEach(function (v) {
            v.classList.toggle("is-active", v.id === "view-" + btn.getAttribute("data-view"));
          });
        };
      });
    }

    var fetchConfig = {
      schema_version: "promo-facts-fetch-1",
      default_source_id: "local",
      cache_bust: true,
      sources: [{ id: "local", label: "review/facts.json", url: "facts.json" }],
    };
    var bootState = { tabsReady: false, campaignIdx: 0 };

    function setFetchStatus(msg) {
      var el = $("fetch-status");
      if (el) el.textContent = msg;
    }

    function boot(payload, meta) {
      meta = meta || {};
      if (!(payload && (payload.campaigns || []).length)) {
        throw new Error("payload has no campaigns");
      }
      window.__PROMO_FACTS__ = payload;
      var embed = document.getElementById("promo-facts");
      if (embed) {
        try {
          embed.textContent = JSON.stringify(payload);
        } catch (e) { /* ignore */ }
      }
      var sel = $("campaign-select");
      var keepIdx = bootState.campaignIdx;
      if (keepIdx >= payload.campaigns.length) keepIdx = 0;
      sel.onchange = function () {
        bootState.campaignIdx = Number(sel.value) || 0;
        render(payload, bootState.campaignIdx);
      };
      if (!bootState.tabsReady) {
        setupTabs();
        bootState.tabsReady = true;
      }
      render(payload, keepIdx);
      if (location.hash === "#charts") {
        var chartsBtn = document.querySelector('.tabs button[data-view="charts"]');
        if (chartsBtn) chartsBtn.click();
      }
      if (meta.status) setFetchStatus(meta.status);
    }

    function readEmbeddedFacts() {
      var el = document.getElementById("promo-facts");
      if (!el) return null;
      var raw = (el.textContent || "").trim();
      if (!raw) return null;
      try { return JSON.parse(raw); } catch (e) { return null; }
    }

    function applyFetchConfig(cfg) {
      if (!cfg || !Array.isArray(cfg.sources) || !cfg.sources.length) return;
      fetchConfig = cfg;
      var sel = $("facts-source");
      var preferred = cfg.default_source_id || cfg.sources[0].id;
      sel.innerHTML = cfg.sources.map(function (s) {
        return "<option value='" + esc(s.id) + "'" +
          (s.id === preferred ? " selected" : "") + ">" +
          esc(s.label || s.id) + "</option>";
      }).join("");
    }

    function selectedSource() {
      var id = $("facts-source").value;
      var sources = fetchConfig.sources || [];
      for (var i = 0; i < sources.length; i++) {
        if (sources[i].id === id) return sources[i];
      }
      return sources[0] || { id: "local", url: "facts.json", label: "facts.json" };
    }

    function isFileProtocol() {
      return location.protocol === "file:";
    }

    function resolveFactsUrl(source) {
      var raw = (source && source.url) || "facts.json";
      var abs;
      try {
        abs = new URL(raw, location.href);
      } catch (e) {
        throw new Error("bad source url: " + raw);
      }
      if (fetchConfig.cache_bust !== false) {
        abs.searchParams.set("t", String(Date.now()));
      }
      return abs.href;
    }

    function explainFetchFailure(err, src, url) {
      var msg = (err && err.message) ? err.message : String(err);
      if (isFileProtocol()) {
        return "Fetch failed under file:// (browser blocks fetch). Serve review/ over HTTP, then retry. e.g. python -m http.server 8765 --directory review";
      }
      if (/HTTP 404/i.test(msg) && src && String(src.url || "").indexOf("..") >= 0) {
        return "Fetch failed: " + msg + " · relative parent path not visible when the server root is review/. Use source 'local' (facts.json) or serve the suite root.";
      }
      if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) {
        return "Fetch failed: network/CORS for " + (url || src && src.url || "facts") + ". Confirm HTTP server is up and URL is same-origin.";
      }
      return "Fetch failed: " + msg;
    }

    function loadFetchConfig() {
      if (isFileProtocol()) {
        applyFetchConfig(fetchConfig);
        setFetchStatus("file:// mode · embedded only · start HTTP server for Fetch latest");
        return Promise.resolve(fetchConfig);
      }
      return fetch("fetch-config.json", { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("fetch-config.json HTTP " + r.status);
          return r.json();
        })
        .then(function (cfg) {
          if (cfg.schema_version && cfg.schema_version !== "promo-facts-fetch-1") {
            console.warn("unexpected fetch-config schema_version", cfg.schema_version);
          }
          applyFetchConfig(cfg);
          setFetchStatus("Config loaded · " + (cfg.sources || []).length + " source(s)");
          return cfg;
        })
        .catch(function () {
          applyFetchConfig(fetchConfig);
          setFetchStatus("No fetch-config.json · using built-in sources");
          return fetchConfig;
        });
    }

    function fetchLatestFacts() {
      var src = selectedSource();
      var btn = $("fetch-latest");
      btn.disabled = true;
      if (isFileProtocol()) {
        setFetchStatus(explainFetchFailure(new Error("file://"), src, src.url));
        btn.disabled = false;
        return Promise.resolve();
      }
      var url;
      try {
        url = resolveFactsUrl(src);
      } catch (e) {
        setFetchStatus(explainFetchFailure(e, src, src && src.url));
        btn.disabled = false;
        return Promise.resolve();
      }
      setFetchStatus("Fetching " + (src.label || src.id) + " → " + (src.url || url));
      return fetch(url, { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error((src.url || url) + " HTTP " + r.status);
          return r.json();
        })
        .then(function (payload) {
          if (!(payload && payload.schema_version === "promo-facts-1")) {
            throw new Error("expected schema_version promo-facts-1 (got " +
              (payload && payload.schema_version) + ")");
          }
          if (!(payload.campaigns || []).length) {
            throw new Error("fetched facts have no campaigns");
          }
          chartState = { campaignId: null, selected: {} };
          boot(payload, {
            status: "Fetched " + (src.label || src.id) + " @ " + new Date().toLocaleTimeString(),
          });
        })
        .catch(function (err) {
          setFetchStatus(explainFetchFailure(err, src, url));
        })
        .finally(function () {
          btn.disabled = false;
        });
    }

    function initialFactsLoad() {
      var embedded = readEmbeddedFacts();
      if (embedded && (embedded.campaigns || []).length) {
        boot(embedded, { status: "Loaded embedded facts · click Fetch latest to refresh" });
        return Promise.resolve();
      }
      if (window.__PROMO_FACTS__ && (window.__PROMO_FACTS__.campaigns || []).length) {
        boot(window.__PROMO_FACTS__, { status: "Loaded window.__PROMO_FACTS__" });
        return Promise.resolve();
      }
      return fetchLatestFacts();
    }

    function wireFetchControls() {
      $("fetch-latest").onclick = function () { fetchLatestFacts(); };
    }

    wireFetchControls();
    loadFetchConfig().then(initialFactsLoad);
  </script>
</body>
</html>
