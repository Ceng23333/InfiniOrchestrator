[package]
name = "infini-loadbalancer"
version = "0.1.0"
edition = "2024"
authors = ["InfiniLM Team"]
description = "High-performance distributed load balancer for InfiniLM services"
license = "MIT"

[lib]
name = "infini_loadbalancer"
path = "src/lib.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "tower-log"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HTTP client (using rustls instead of OpenSSL to avoid system dependencies)
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Configuration
clap = { version = "4.5", features = ["derive", "env"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"

# Async utilities
futures = "0.3"
lazy_static = "1.4"
tokio-stream = "0.1"

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# Hashing
sha2 = "0.10"

# Base64 encoding for etcd HTTP API
base64 = "0.22"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"

[[bin]]
name = "infini-loadbalancer"
path = "src/main.rs"

[[bin]]
name = "infini-entrypoint"
path = "src/bin/entrypoint.rs"

[[bin]]
name = "infini-sharepool"
path = "src/bin/sharepool.rs"

[[bin]]
name = "infini-registry"
path = "src/bin/registry.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
